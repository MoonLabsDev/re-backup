<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64" role="img" aria-label="ReBackup">
  <title>ReBackup</title>
  <!-- Master of the app icon ("Cycle"): a refresh arrow around a drive labeled RE. 64x64 design grid.
