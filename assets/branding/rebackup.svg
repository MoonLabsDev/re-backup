    <path d="M51 33 A19 19 0 1 1 45.5 19.6"/>
    <path d="M46.5 9.5 V20.5 H35.5"/>
  </g>
  <rect x="20" y="25" width="24" height="16" rx="3.5" fill="#E6EAF0"/>
  <circle cx="38.5" cy="33" r="2.1" fill="#2BB3A3"/>
  <text x="22.4" y="36.4" font-family="Segoe UI, Arial, sans-serif" font-weight="900" font-size="8.2" fill="#0F1216">RE</text>
